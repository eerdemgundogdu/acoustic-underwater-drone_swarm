[platformio]
default_envs = teensy41_acoustic_node

[env:teensy41_acoustic_node]
platform = teensy
board = teensy41
framework = arduino
build_src_filter =
    +<../teensy_node/main.cpp>
    +<acoustic_dsp.cpp>
    +<swarm_mesh.cpp>
    +<piezo_harvester.cpp>
build_flags =
    -std=gnu++17
    -O2
    -Iinclude
