; Iki derleme secenegi ayni modulleri paylasir:
;   pio run -e node    -> Rev A kart: PWR_HOLD ile uyanma/uyku dongusu
;   pio run -e bench   -> Tezgah: USB beslemede, dinleme penceresi bitince kapanmaz
; Suru anahtari sahada build_flags ile verilir: -D SWARM_KEY_BYTES=0x..,0x..,...(16 bayt)

[platformio]
default_envs = node

[env]
platform = teensy
board = teensy41
framework = arduino
build_src_filter =
    +<*.cpp>
    +<../teensy_node/main.cpp>
build_flags =
    -std=gnu++17
    -O2
    -Iinclude
    -Iteensy_node
    -D USB_SERIAL
build_unflags = -std=gnu++14
monitor_speed = 115200
upload_protocol = teensy-cli

[env:node]
build_flags =
    ${env.build_flags}
    -D NODE_ID=3

[env:bench]
build_flags =
    ${env.build_flags}
    -D NODE_ID=1
    -D NODE_BENCH=1
